[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtpipe"
version = "0.1.0"
description = "Large-scale data processing, synthetic data generation and preference tuning for machine translation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["mtpipe*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
